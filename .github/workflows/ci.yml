name: Repository acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market_hunt
          POSTGRES_PASSWORD: market_hunt
          POSTGRES_DB: market_hunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_hunt -d market_hunt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://market_hunt:market_hunt@localhost:5432/market_hunt_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m scanner.control_plane migrate
      - run: python -m scanner.production_audit
      - run: python -m pytest -q
