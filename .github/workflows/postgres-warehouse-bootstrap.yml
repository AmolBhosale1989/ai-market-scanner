name: PostgreSQL Warehouse Bootstrap

on:
  push:
    paths:
      - '.github/workflows/postgres-warehouse-bootstrap.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Universe symbols to bootstrap (0 = all)'
        required: false
        default: '420'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore universe catalogue
        shell: bash
        run: |
          mkdir -p outputs
          git fetch origin scan-data:refs/remotes/origin/scan-data
          git show "origin/scan-data:dashboard-data/tradable_universe.csv" > outputs/tradable_universe.csv
      - name: Migrate and verify PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          python -m scanner.warehouse_migrate
          python -m scanner.bitemporal_warehouse --verify-health
      - name: Bootstrap daily history in resumable chunks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        shell: bash
        run: |
          set -euo pipefail
          TOTAL="${{ inputs.limit || '420' }}"
          CHUNK=25
          for ((OFFSET=0; OFFSET<TOTAL; OFFSET+=CHUNK)); do
            echo "BOOTSTRAP_DAILY offset=$OFFSET limit=$CHUNK"
            python -m scanner.warehouse_refresh --bootstrap --period 1y --interval 1d --offset "$OFFSET" --limit "$CHUNK"
          done
      - name: Bootstrap recent intraday history in resumable chunks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        shell: bash
        run: |
          set -euo pipefail
          TOTAL="${{ inputs.limit || '420' }}"
          CHUNK=25
          for ((OFFSET=0; OFFSET<TOTAL; OFFSET+=CHUNK)); do
            echo "BOOTSTRAP_INTRADAY offset=$OFFSET limit=$CHUNK"
            python -m scanner.warehouse_refresh --bootstrap --period 5d --interval 5m --offset "$OFFSET" --limit "$CHUNK"
          done
