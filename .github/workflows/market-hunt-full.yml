name: Market Hunt Daily Broad Scan

on:
  push:
    paths:
      - 'scanner/**'
      - 'requirements.txt'
      - '.github/workflows/market-hunt-full.yml'
      - '.github/workflows/market-hunt-intraday.yml'
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-hunt-full
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full-market prefilter plus ranked deep scan
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python -m scanner.main --top 50 --deep-limit 1500
      - name: Save latest base scan for intraday monitor
        if: success()
        uses: actions/cache/save@v4
        with:
          path: outputs
          key: market-hunt-base-${{ github.run_id }}
      - name: Publish latest scan data for dashboard
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "market-hunt-bot"
          git config user.email "market-hunt-bot@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" "origin/main" -- scanner requirements.txt .github/workflows/market-hunt-full.yml; then
            echo "A newer scanner revision exists on main; skipping stale dashboard publish."
            exit 0
          fi
          git fetch origin scan-data:scan-data
          rm -rf /tmp/market-hunt-scan-data
          git worktree add /tmp/market-hunt-scan-data scan-data
          mkdir -p /tmp/market-hunt-scan-data/dashboard-data
          for f in recommended_trades.csv liquid_leaders.csv watchlist.csv latest_scan.csv all_candidates.csv scan_health.csv trending_themes.csv tradable_universe.csv upcoming_events.csv event_status.csv product_feed.json legendary_setups.csv legendary_consensus.csv trader_minervini.csv trader_oneil.csv trader_weinstein.csv trader_darvas.csv trader_livermore.csv trader_qullamaggie.csv trader_druckenmiller.csv trader_lawwaisum.csv trader_martinluk.csv trader_top500swing.csv trader_highmomentumbeta.csv trader_superstock.csv trader_brownmoose.csv trader_venu.csv; do
            if [ -f "outputs/$f" ]; then
              cp "outputs/$f" "/tmp/market-hunt-scan-data/dashboard-data/$f"
            fi
          done
          printf "generated_at_utc,workflow_run_id,source_commit\n%s,%s,%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/market-hunt-scan-data/dashboard-data/scan_metadata.csv
          cd /tmp/market-hunt-scan-data
          git add dashboard-data
          if git diff --cached --quiet; then
            echo "Dashboard data unchanged."
          else
            git commit -m "Update dashboard scan data [skip ci]"
            git push origin scan-data
          fi

      - name: Upload full scan outputs and health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-full-results
          path: outputs/
          if-no-files-found: warn
