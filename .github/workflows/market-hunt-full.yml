name: Market Hunt Full Universe Scan

on:
  push:
    paths:
      - 'scanner/**'
      - 'requirements.txt'
      - '.github/workflows/market-hunt-full.yml'
  workflow_dispatch:

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full U.S. universe scan
        run: python -m scanner.main --top 50

      - name: Upload full scan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-full-results
          path: outputs/
          if-no-files-found: warn
