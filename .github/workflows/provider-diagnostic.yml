name: Provider price diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/provider-diagnostic.yml'
      - 'scripts/provider_comparison.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare batch and individual completed bars without database writes
        run: PYTHONPATH=. python -u scripts/provider_comparison.py
