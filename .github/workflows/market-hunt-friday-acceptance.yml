name: Market Hunt Deterministic Friday Acceptance

on:
  push:
    paths:
      - 'scanner/**'
      - 'tests/**'
      - '.github/workflows/market-hunt-friday-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Enforce provider boundary
        run: python -m scanner.production_audit
      - name: Replay deterministic Friday chain
        run: python -m scanner.production_acceptance
      - name: Verify acceptance regression tests
        run: python -m pytest -q tests/test_friday_e2e_acceptance.py tests/test_warehouse_production_gates.py tests/test_production_market_data_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: friday-production-acceptance-${{ github.run_id }}
          path: outputs/friday_e2e_acceptance.json
          if-no-files-found: error
