name: Lineage integration workspace export
on:
  push:
    branches: [validation/lineage-db-contracts]
    paths: ['.github/workflows/lineage-workspace.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/validation/lineage-db-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export tracked source only, no credentials or runtime data
        run: git archive --format=tar HEAD > lineage-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-integration-source-${{ github.sha }}
          path: lineage-source.tar
          retention-days: 3
