name: Market Hunt V4 Outcome Resolution

on:
  push:
    paths:
      - 'scanner/v4/**'
      - 'scanner/v5/**'
      - 'scanner/v6/**'
      - 'scanner/v7/**'
      - 'scanner/v4_model_monitor.py'
      - 'scanner/v4_cutover.py'
      - 'scanner/v5_model.py'
      - 'scanner/v6_model.py'
      - 'scanner/v7_allocator.py'
      - 'scanner/v7_criteria_optimizer.py'
      - 'scanner/v7_challenger.py'
      - 'scanner/v4_evidence.py'
      - 'scanner/v8_operations.py'
      - 'scanner/v9_readiness.py'
      - '.github/workflows/market-hunt-v4-outcomes.yml'
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-hunt-v4-outcomes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Restore V4 signal history
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: market-hunt-state-outcomes-missing-${{ github.run_id }}
          restore-keys: |
            market-hunt-state-
      - name: Restore durable evidence ledgers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/market-hunt-evidence
          git fetch origin scan-data:refs/remotes/origin/scan-data
          git worktree add --detach /tmp/market-hunt-evidence origin/scan-data
          python -m scanner.v4_evidence --state-dir .state/v4 --import-dir /tmp/market-hunt-evidence
          mkdir -p outputs
          for f in scan_health.csv social_engine_health.json validation_gate.json; do
            if [ -f "/tmp/market-hunt-evidence/dashboard-data/$f" ]; then
              cp "/tmp/market-hunt-evidence/dashboard-data/$f" "outputs/$f"
            fi
          done
          if [ -f /tmp/market-hunt-evidence/evidence-state/v7_3_challenger_state.json ]; then
            mkdir -p .state/v4
            cp /tmp/market-hunt-evidence/evidence-state/v7_3_challenger_state.json .state/v4/v7_3_challenger_state.json
          fi
          git worktree remove --force /tmp/market-hunt-evidence
      - name: Verify deterministic replay
        run: python -m scanner.v4_outcomes --verify-replay
      - name: Resolve available daily horizons
        run: python -m scanner.v4_outcomes --resolve-daily
      - name: Resolve existing point-in-time snapshot horizons
        run: python -m scanner.v4_shadow_validation --resolve-only
      - name: Fit V4.5 calibrated ranking model
        run: python -m scanner.v4_outcomes --fit-calibration
      - name: Monitor V4.5 calibration and expectancy
        run: python -m scanner.v4_model_monitor
      - name: Fit V5 regime-adaptive shadow model
        run: python -m scanner.v5_model
      - name: Fit V6 uncertainty-aware shadow ensemble
        run: python -m scanner.v6_model
      - name: Build V7 portfolio-aware paper plan
        run: python -m scanner.v7_allocator
      - name: Record and resolve V3 through V7 point-in-time evidence
        run: python -m scanner.v4_shadow_validation --record-only
      - name: Check V7.1 evidence pipeline health
        run: python -m scanner.v4_evidence --state-dir .state/v4 --output-dir outputs --health
      - name: Evaluate bounded V7.2 criteria proposals
        run: python -m scanner.v7_criteria_optimizer --state-dir .state/v4 --output-dir outputs
      - name: Evaluate prospective V7.3 challenger
        run: python -m scanner.v7_challenger --state-dir .state/v4 --output-dir outputs
      - name: Evaluate V4.6 gates and enforce automatic rollback
        run: python -m scanner.v4_cutover --evaluate --enforce-safety
      - name: Evaluate V8.1 operational health and safety locks
        run: python -m scanner.v8_operations --state-dir .state/v4 --output-dir outputs
      - name: Evaluate fail-closed V9 production readiness
        run: python -m scanner.v9_readiness --output-dir outputs
      - name: Save enriched V4 signal history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: market-hunt-state-${{ github.run_id }}
      - name: Publish V4.2 outcome evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "market-hunt-bot"
          git config user.email "market-hunt-bot@users.noreply.github.com"
          git fetch origin scan-data:scan-data
          rm -rf /tmp/market-hunt-scan-data
          git worktree add /tmp/market-hunt-scan-data scan-data
          mkdir -p /tmp/market-hunt-scan-data/dashboard-data /tmp/market-hunt-scan-data/evidence-state
          for f in v4_outcomes.csv v4_outcome_summary.csv v4_5_model.json v4_5_validation.csv v4_5_ranked_candidates.csv v4_shadow_observations.csv v4_shadow_strategy_summary.csv v4_shadow_daily_comparison.csv v4_shadow_breakdowns.csv v4_shadow_validation_health.json v4_model_monitor.json v4_model_monitor.csv v4_6_cutover_evaluation.json v5_model.json v5_validation.csv v5_ranked_candidates.csv v6_model.json v6_validation.csv v6_ranked_candidates.csv v7_paper_portfolio.csv v7_allocation_health.json v7_1_evidence_health.json v7_2_criteria_proposal.json v7_2_criteria_validation.csv v7_2_criteria_grid.csv v7_3_challenger_health.json v7_3_challenger_comparison.csv v8_1_operational_health.json v8_1_operational_health.csv v9_readiness.json v9_readiness.csv; do
            if [ -f "outputs/$f" ]; then
              cp "outputs/$f" "/tmp/market-hunt-scan-data/dashboard-data/$f"
            fi
          done
          for f in v4_outcomes.json v4_shadow_observations.json v7_3_challenger_state.json; do
            if [ -f ".state/v4/$f" ]; then
              cp ".state/v4/$f" "/tmp/market-hunt-scan-data/evidence-state/$f"
            fi
          done
          cd /tmp/market-hunt-scan-data
          git add dashboard-data evidence-state
          if ! git diff --cached --quiet; then
            git commit -m "Update V4 outcome evidence [skip ci]"
            git pull --rebase origin scan-data
            git push origin scan-data
          fi
      - name: Upload V4.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-v4-outcomes-${{ github.run_id }}
          path: |
            outputs/v4_outcomes.csv
            outputs/v4_outcome_summary.csv
            .state/v4/v4_outcomes.json
            outputs/v4_5_model.json
            outputs/v4_5_validation.csv
            outputs/v4_5_ranked_candidates.csv
            .state/v4/v4_shadow_observations.json
            outputs/v4_shadow_observations.csv
            outputs/v4_shadow_strategy_summary.csv
            outputs/v4_shadow_daily_comparison.csv
            outputs/v4_shadow_breakdowns.csv
            outputs/v4_shadow_validation_health.json
            outputs/v4_model_monitor.json
            outputs/v4_model_monitor.csv
            outputs/v4_6_cutover_evaluation.json
            .state/v4/v5_model.json
            outputs/v5_model.json
            outputs/v5_validation.csv
            outputs/v5_ranked_candidates.csv
            .state/v4/v6_model.json
            outputs/v6_model.json
            outputs/v6_validation.csv
            outputs/v6_ranked_candidates.csv
            outputs/v7_paper_portfolio.csv
            outputs/v7_allocation_health.json
            outputs/v7_1_evidence_health.json
            .state/v4/v7_2_criteria_proposal.json
            outputs/v7_2_criteria_proposal.json
            outputs/v7_2_criteria_validation.csv
            outputs/v7_2_criteria_grid.csv
            .state/v4/v7_3_challenger_state.json
            outputs/v7_3_challenger_health.json
            outputs/v7_3_challenger_comparison.csv
            outputs/v8_1_operational_health.json
            outputs/v8_1_operational_health.csv
            outputs/v9_readiness.json
            outputs/v9_readiness.csv
          if-no-files-found: warn
