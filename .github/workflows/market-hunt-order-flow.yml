name: Market Hunt Order Flow Live

on:
  schedule:
    - cron: '3,13,23,33,43,53 13-21 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-hunt-order-flow.yml'
      - 'scanner/order_flow.py'
      - 'scanner/order_flow_strategy.py'
      - 'scanner/order_flow_validation.py'
      - 'scanner/momentum_signals.py'
      - 'scanner/broad_breakout.py'
      - 'scanner/v31_challenger.py'
      - 'scanner/sector_rotation.py'
      - 'scanner/theme_live.py'

permissions:
  contents: write

jobs:
  order-flow-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: market-hunt-order-flow-live
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore required inputs and prior validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          git fetch origin scan-data:refs/remotes/origin/scan-data
          for f in tradable_universe.csv latest_scan.csv all_candidates.csv trending_themes.csv order_flow_strategy_journal.csv order_flow_strategy_performance.csv high_conviction_alert_log.csv high_conviction_alert_health.csv intraday_live.csv v31_challenger_log.csv v31_challenger_summary.csv v31_challenger_decisions.csv; do
            git show "origin/scan-data:dashboard-data/$f" > "outputs/$f" || true
          done
          test -s outputs/tradable_universe.csv

      - name: Refresh live themes
        continue-on-error: true
        run: timeout 150s python -m scanner.theme_live

      - name: Refresh sector rotation
        continue-on-error: true
        run: timeout 150s python -m scanner.sector_rotation

      - name: Scan broad liquid breakouts
        run: timeout 210s python -m scanner.broad_breakout

      - name: Refresh fast momentum
        run: timeout 150s python -m scanner.momentum_signals

      - name: Refresh order flow strategy
        run: timeout 90s python -m scanner.order_flow_strategy

      - name: Validate fresh live outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/order_flow_strategy.csv
          test "$(wc -l < outputs/order_flow_strategy.csv)" -gt 1
          test -s outputs/order_flow_strategy_health.csv
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          p = 'outputs/order_flow_strategy_health.csv'
          with open(p, newline='') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('order_flow_strategy_health.csv has no data rows')
          row = rows[-1]
          raw = row.get('last_update_utc') or row.get('updated_at_utc') or row.get('timestamp_utc')
          if not raw:
              raise SystemExit('order-flow health has no freshness timestamp')
          ts = datetime.fromisoformat(raw.replace('Z', '+00:00'))
          age = (datetime.now(timezone.utc) - ts.astimezone(timezone.utc)).total_seconds() / 60
          if age < -5 or age > 20:
              raise SystemExit(f'order-flow output is stale: age={age:.1f} minutes')
          print(f'Fresh order-flow output verified: age={age:.1f} minutes')
          PY

      - name: Update order flow validation
        continue-on-error: true
        run: timeout 150s python -m scanner.order_flow_validation

      - name: Run V3.1 shadow challenger
        continue-on-error: true
        run: timeout 180s python -m scanner.v31_challenger

      - name: Send high-conviction Telegram alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 90s python -m scanner.high_conviction_alerts

      - name: Refresh unified live-system health
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for f in monitor_health.csv v4_worker_health.json theme_health.csv sector_rotation_health.csv momentum_health.csv broad_breakout_health.csv order_flow_strategy_health.csv high_conviction_alert_health.csv premarket_health.csv daily_top_pick_summary.csv; do
            if [ ! -s "outputs/$f" ]; then
              git show "origin/scan-data:dashboard-data/$f" > "outputs/$f" || true
            fi
          done
          python -m scanner.system_health

      - name: Publish order flow data
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/order_flow_strategy.csv
          test "$(wc -l < outputs/order_flow_strategy.csv)" -gt 1
          git config user.name "market-hunt-bot"
          git config user.email "market-hunt-bot@users.noreply.github.com"
          rm -rf /tmp/market-hunt-order-flow
          git fetch origin scan-data:scan-data
          git worktree add /tmp/market-hunt-order-flow scan-data
          mkdir -p /tmp/market-hunt-order-flow/dashboard-data
          for f in trending_themes.csv theme_health.csv sector_rotation.csv rotation_leaders.csv sector_rotation_health.csv broad_breakout_discovery.csv broad_breakout_health.csv momentum_signals.csv momentum_health.csv order_flow_strategy.csv order_flow_strategy_health.csv order_flow_strategy_journal.csv order_flow_strategy_performance.csv v31_challenger_log.csv v31_challenger_summary.csv v31_challenger_decisions.csv high_conviction_alert_log.csv high_conviction_alert_health.csv live_system_health.csv live_system_health_summary.csv; do
            if [ -s "outputs/$f" ]; then
              cp "outputs/$f" "/tmp/market-hunt-order-flow/dashboard-data/$f"
            fi
          done
          printf "updated_at_utc,workflow_run_id,source_commit,data_status\n%s,%s,%s,FRESH\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/market-hunt-order-flow/dashboard-data/order_flow_live_metadata.csv
          cd /tmp/market-hunt-order-flow
          git add dashboard-data
          if ! git diff --cached --quiet; then
            git commit -m "Update live order flow [skip ci]"
            git pull --rebase origin scan-data
            git push origin scan-data
          fi

      - name: Upload order flow outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-order-flow-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
