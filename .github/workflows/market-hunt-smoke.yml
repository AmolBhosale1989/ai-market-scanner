name: Market Hunt Smoke Test

on:
  push:
    paths:
      - 'scanner/**'
      - 'requirements.txt'
      - '.github/workflows/market-hunt-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 300-stock representative smoke test with health gate
        run: python -m scanner.main --refresh-universe --limit 300 --top 20

      - name: Run focused backtest smoke\n        run: python -m scanner.backtest --tickers AAPL,MSFT,NVDA,AMD,META --period 2y --horizon 7 --stride 10\n\n      - name: Upload scan outputs and health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-smoke-results
          path: outputs/
          if-no-files-found: warn
