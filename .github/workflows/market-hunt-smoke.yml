name: Market Hunt Smoke Test

on:
  push:
    paths:
      - 'scanner/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/market-hunt-smoke.yml'
  workflow_dispatch:

concurrency:
  group: market-hunt-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run deterministic unit tests
        run: python -m pytest -q
      - name: Enforce PostgreSQL-only production boundary
        run: python -m scanner.production_audit
      - name: Prepare representative authoritative warehouse
        run: |
          python -m scanner.warehouse_migrate
          python -m scanner.universe --refresh
          timeout 1500s python -m scanner.warehouse_refresh --symbols-file outputs/master_universe.csv --sample 300 --period 1y --interval 1d
      - name: Check bounded SEC catalyst access with official search fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import pandas as pd
          from scanner.v4.catalysts import SecFilingAdapter

          with tempfile.TemporaryDirectory() as root:
              adapter = SecFilingAdapter(Path(root) / "ticker-map.json", max_workers=2)
              _, health = adapter.poll(pd.DataFrame({"ticker": ["AXTI", "CRDO", "INTC"]}))
              assert health["resolved"] == 3, health
              assert health["errors"] == 0, health
              assert health["submissions_errors"] == health["search_fallbacks"] + health["relay_fallbacks"] + health["nasdaq_fallbacks"], health
              assert health["search_errors"] == health["relay_fallbacks"] + health["nasdaq_fallbacks"], health
              assert health["relay_errors"] == health["nasdaq_fallbacks"], health
              print(health)
          PY

      - name: Run 300-stock representative smoke test with health gate
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python -m scanner.main --limit 300 --top 20 --deep-limit 150

      - name: Run focused backtest smoke
        run: python -m scanner.backtest --tickers AAPL,MSFT,NVDA,AMD,META --period 2y --horizon 7 --stride 10

      - name: Run event-calendar self-check
        shell: bash
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from scanner.events import _parse_alpha_vantage_calendar, _alpha_vantage_earnings_events

          u=pd.DataFrame([
              {"ticker":"TEST","name":"Calendar self-check","avg_dollar_volume20":100000000,"tradable":True}
          ])
          body="symbol,name,reportDate,fiscalDateEnding,estimate,currency\nTEST,Calendar self-check,2026-09-15,2026-06-30,1.23,USD\n"
          rows=_parse_alpha_vantage_calendar(body,u,now=pd.Timestamp("2026-09-12T00:00:00Z"))
          assert rows and rows[0]["ticker"]=="TEST"
          assert rows[0]["event_source"]=="ALPHA_VANTAGE"
          print("Alpha Vantage parser self-check passed.")

          if os.getenv("ALPHA_VANTAGE_API_KEY","").strip():
              live=_alpha_vantage_earnings_events(u)
              print(f"Alpha Vantage live provider check returned {len(live)} matching TEST rows (zero is expected for synthetic ticker).")
          else:
              print("ALPHA_VANTAGE_API_KEY not configured; live provider check skipped.")
          PY

      - name: Run earnings intelligence self-check
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from scanner.earnings_intel import _beat_miss_stats

          q=pd.DataFrame({
              "surprisePercentage":[10.0,5.0,-2.0,8.0],
              "reportedEPS":[1.10,1.05,0.98,1.08],
              "estimatedEPS":[1.00,1.00,1.00,1.00],
          })
          m=_beat_miss_stats(q)
          assert m["earnings_history_samples"]==4
          assert m["beat_rate_pct"]==75.0
          assert m["latest_surprise_pct"]==10.0
          assert m["surprise_streak"]==2
          print("Earnings intelligence self-check passed.")
          PY

      - name: Run performance calibration self-check
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from scanner.performance import build_performance_reports, build_empirical_calibration

          rows=[]
          for i in range(24):
              rows.append({
                  "ticker":f"T{i}",
                  "outcome":"TARGET_HIT" if i%2==0 else "FAILED_BREAKOUT",
                  "return_pct":5.0 if i%2==0 else -2.0,
                  "r_multiple":2.0 if i%2==0 else -1.0,
                  "entry_model":"RESISTANCE_BREAKOUT",
                  "market_regime_state":"STRONG",
                  "theme":"TEST",
                  "catalyst_status":"NONE",
                  "stage":"ARMED",
                  "market_hunt_score":70 if i<20 else 50,
                  "technical_score":70,
                  "effective_rr":3.0,
                  "live_confirmation_score":80,
              })
          j=pd.DataFrame(rows)
          s,g=build_performance_reports(j)
          assert int(s.iloc[0]["closed_signals"])==24
          assert float(s.iloc[0]["win_rate_pct"])==50.0
          c=build_empirical_calibration(j,min_samples=20)
          assert not c.empty
          assert "USABLE" in set(c["calibration_status"])
          print("Performance and calibration self-check passed.")
          PY

      - name: Run live/journal self-checks
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas as pd
          from scanner.live import _market_state
          from scanner.intraday import _derive_state, _update_paper_journal, JOURNAL_FILE
          from scanner.config import OUTPUT_DIR

          NY=ZoneInfo("America/New_York")
          assert _market_state(datetime(2026,9,12,10,0,tzinfo=NY))=="MARKET CLOSED"

          row={
              "live_status":"LIVE","live_price":105.0,"stop":98.0,"effective_target":110.0,
              "negative_catalyst_risk":False,"live_trigger_reached":True,"live_above_vwap":True,
              "intraday_rvol":1.5,"live_trade_action":"BUY / LIVE CONFIRMED",
              "ticker":"TEST","stage":"ARMED","entry_trigger":100.0,"effective_rr":5.0,
              "entry_model":"RESISTANCE_BREAKOUT","entry_condition":"BREAKOUT",
              "market_regime_state":"STRONG","theme":"Semiconductors","catalyst_status":"ACTIVE",
              "monitor_state":"LIVE_CONFIRMED",
          }
          assert _derive_state(pd.Series(row),"")=="LIVE_CONFIRMED"
          j=_update_paper_journal(pd.DataFrame([row]),"2026-09-12T10:00:00-04:00")
          assert len(j)>=1 and "TEST" in set(j["ticker"].astype(str))

          if JOURNAL_FILE.exists():
              JOURNAL_FILE.unlink()
          out=OUTPUT_DIR/"paper_journal.csv"
          if out.exists():
              out.unlink()
          print("Live calendar, first-state confirmation, and journal self-checks passed.")
          PY

      - name: Upload scan outputs and health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-smoke-results
          path: outputs/
          if-no-files-found: warn
