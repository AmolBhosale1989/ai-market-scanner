name: PostgreSQL production publication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full rebuild, live refresh, or one supervised Feeder-only cycle
        type: choice
        options: [full, live, feeder]
        default: live
  schedule:
    # Offset requests from the busiest hour/quarter-hour boundaries.
    - cron: "37 12 * * 1-5"
    - cron: "7,22,37,52 13-22 * * 1-5"

concurrency:
  # A supervised Feeder must not replace a queued production publication.
  # The called workflow separately owns market-hunt-live-feeder.
  group: ${{ inputs.mode == 'feeder' && 'market-hunt-feeder-dispatch' || 'market-hunt-production' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  feeder_validation:
    # The new workflow is not registered on main until the split is merged.
    # Reuse its exact branch version for one explicitly selected supervised cycle.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'feeder' }}
    uses: ./.github/workflows/live_feeder.yml
    with:
      cycles: 1
    secrets: inherit
  publish:
    # Opt-in cutover: the daily full lane remains authoritative; scheduled live
    # work moves to live_feeder/live_engine only after explicit activation.
    if: ${{ inputs.mode != 'feeder' && (github.event_name == 'workflow_dispatch' || vars.LIVE_PIPELINES_ENABLED != 'true' || github.event.schedule == '37 12 * * 1-5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
      PYTHONUNBUFFERED: "1"
      CATALYST_MODE: disabled
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select run type
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "37 12 * * 1-5" ]]; then
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=live" >> "$GITHUB_ENV"
          fi
      - name: Initialize transactional run
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m scanner.control_plane migrate
          PRODUCTION_RUN_ID=$(python -m scanner.control_plane start --mode production)
          test -n "$PRODUCTION_RUN_ID"
          echo "PRODUCTION_RUN_ID=$PRODUCTION_RUN_ID" >> "$GITHUB_ENV"
      - name: Execute complete dependency chain
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            python -m scanner.production_telemetry --failure-stage "${CURRENT_STAGE:-initialization}" --message "command failed at line $1"
          }
          trap 'fail $LINENO' ERR
          stage() {
            CURRENT_STAGE="$1"
            local order="$2"
            shift 2
            python -m scanner.control_plane stage-begin --name "$CURRENT_STAGE" --order "$order"
            "$@"
            python -m scanner.control_plane stage-pass --name "$CURRENT_STAGE"
          }
          wait_stage() {
            local pid="$1"
            local name="$2"
            if ! wait "$pid"; then
              CURRENT_STAGE="$name"
              return 1
            fi
          }

          PIPELINE_MODE=$(python -m scanner.run_policy --requested "$PIPELINE_MODE")
          echo "PIPELINE_MODE=$PIPELINE_MODE" >> "$GITHUB_ENV"
          if [[ "$PIPELINE_MODE" == "live" ]]; then
            stage seed_snapshot 10 python -m scanner.production_telemetry --seed --mode production
          else
            stage master_universe 10 python -m scanner.universe --refresh
            stage critical_daily_warehouse 15 timeout 600s python -m scanner.warehouse_refresh --critical-only --period 1y --interval 1d
            stage critical_daily_gate 16 python -m scanner.warehouse_gate --tier CRITICAL_DAILY
            stage daily_warehouse 20 timeout 4200s python -m scanner.warehouse_refresh --dataset master_universe --period 1y --interval 1d
            stage daily_gate 30 python -m scanner.warehouse_gate --tier MASTER_DAILY --tier CRITICAL_DAILY
            # Structural ticker plan only; no enrichment or signals before T0.
            stage daily_prepare 40 timeout 4200s python -m scanner.main --prepare-only
            stage live_plan 50 python -m scanner.universe_plan --include-daily-candidates
          fi

          export INTRADAY_FETCH_WORKERS=10
          stage intraday_warehouse 60 timeout 3600s python -m scanner.live_ingestion
          # Collect mandatory Alpha evidence before T0; technical enrichment
          # remains disabled for strategies. Optional provider I/O stays skipped.
          stage catalyst_ingest 65 timeout --kill-after=5s 150s env CATALYST_MODE=optional python -m scanner.catalyst_pipeline --ingest-only --mandatory-only
          stage warehouse_gate 70 python -m scanner.warehouse_gate --tier MASTER_DAILY --tier CRITICAL_DAILY --tier CRITICAL_INTRADAY --tier THEME_INTRADAY --tier LIVE_INTRADAY
          # Consumers read the same validated versions and evaluate arrival age
          # at that snapshot. Publication still rechecks actual-time freshness.
          export WAREHOUSE_CONSUMER_SNAPSHOT=1
          stage catalyst_gate 72 python -m scanner.catalyst_pipeline --verify-only
          if [[ "$PIPELINE_MODE" == "full" ]]; then
            stage broad_breakout 110 python -m scanner.broad_breakout & broad_pid=$!
            stage theme_live 90 python -m scanner.theme_live & theme_pid=$!
            stage sector_rotation 100 python -m scanner.sector_rotation & sector_pid=$!
            stage premarket 115 python -m scanner.premarket & premarket_pid=$!

            wait_stage "$premarket_pid" premarket
            wait_stage "$broad_pid" broad_breakout
            stage v3_live 80 python -m scanner.v3_live --reuse-current-broad-discovery --defer-finalization & v3_pid=$!
            wait_stage "$sector_pid" sector_rotation
            stage momentum 120 python -m scanner.momentum_signals
            stage order_flow 130 python -m scanner.order_flow_strategy
            wait_stage "$v3_pid" v3_live
            wait_stage "$theme_pid" theme_live
            # Rebuild daily technical inputs from the frozen live plan at T0,
            # then enrich and score. Keep primary V3 recommendation ownership.
            stage daily_scan 135 python -m scanner.main --finalize-prepared --defer-publication
            stage strategy_finalize 138 python -m scanner.strategy_finalize --full
            stage order_flow_validation 140 python -m scanner.order_flow_validation
            stage v31_challenger 145 python -m scanner.v31_challenger
            stage paper_performance 150 bash -c 'python -m scanner.performance && python -m scanner.readiness'
            stage discovery_products 160 bash -c 'python -m scanner.daily_pick && python -m scanner.high_conviction_alerts && python -m scanner.product_feed'
            stage quant_shadow 170 python -m scanner.quant_shadow
            stage v4_live 180 python -m scanner.v4_worker --once --options-microstructure
            stage v4_outcomes 190 bash -c 'python -m scanner.v4_outcomes --resolve-daily --fit-calibration'
            stage v5_model 200 python -m scanner.v5_model
            stage v6_model 210 python -m scanner.v6_model
            stage v7_allocator 220 python -m scanner.v7_allocator
            stage v4_shadow 230 python -m scanner.v4_shadow_validation
            stage evidence 240 bash -c 'python -m scanner.v4_evidence --health && python -m scanner.v4_model_monitor && python -m scanner.v4_cutover --evaluate --enforce-safety'
            stage v7_research 250 bash -c 'python -m scanner.v7_criteria_optimizer && python -m scanner.v7_challenger'
            stage social 260 python -m scanner.social_engine
            stage operational_health 270 bash -c 'python -m scanner.system_health --require-production && python -m scanner.v8_operations && python -m scanner.v8_scorecard && python -m scanner.v9_readiness && python -m scanner.v9_pilot'
          else
            # The market-open lane has a ten-minute freshness contract. Launch
            # independent consumers against the same validated warehouse
            # snapshot, then join only where a dataset dependency requires it.
            stage broad_breakout 110 python -m scanner.broad_breakout & broad_pid=$!
            stage theme_live 90 python -m scanner.theme_live & theme_pid=$!
            stage sector_rotation 100 python -m scanner.sector_rotation & sector_pid=$!
            stage premarket 115 python -m scanner.premarket & premarket_pid=$!
            stage v4_live 180 python -m scanner.v4_worker --once --options-microstructure & v4_pid=$!

            wait_stage "$premarket_pid" premarket
            wait_stage "$broad_pid" broad_breakout
            stage v3_live 80 python -m scanner.v3_live --reuse-current-broad-discovery --defer-finalization & v3_pid=$!
            wait_stage "$sector_pid" sector_rotation
            stage momentum 120 python -m scanner.momentum_signals
            stage order_flow 130 python -m scanner.order_flow_strategy
            wait_stage "$v3_pid" v3_live
            wait_stage "$theme_pid" theme_live
            stage strategy_finalize 138 python -m scanner.strategy_finalize

            stage order_flow_validation 140 python -m scanner.order_flow_validation & validation_pid=$!
            stage v31_challenger 145 python -m scanner.v31_challenger & challenger_pid=$!
            stage paper_performance 150 bash -c 'python -m scanner.performance && python -m scanner.readiness' & paper_pid=$!
            stage daily_pick 155 python -m scanner.daily_pick & pick_pid=$!
            stage high_conviction_alerts 158 python -m scanner.high_conviction_alerts & alerts_pid=$!

            wait_stage "$validation_pid" order_flow_validation
            wait_stage "$challenger_pid" v31_challenger
            wait_stage "$paper_pid" paper_performance
            wait_stage "$pick_pid" daily_pick
            wait_stage "$alerts_pid" high_conviction_alerts
            stage discovery_products 160 python -m scanner.product_feed
            wait_stage "$v4_pid" v4_live

            # Daily research, social and evidence-maturity artifacts are seeded
            # from the last atomic full publication. The live lane updates only
            # market-sensitive datasets before the final real-time freshness gate.
            stage operational_health 270 python -m scanner.system_health --require-production
          fi

          stage audit 280 python -m scanner.production_audit
          stage acceptance 290 python -m scanner.production_acceptance
          CURRENT_STAGE=publication
          python -m scanner.production_telemetry --finalize --mode production
      - name: Evaluate live-session continuation
        id: live_continuation
        # Supervised draft-branch validation must not enqueue an unbounded chain.
        if: ${{ success() && github.ref == 'refs/heads/main' && vars.LIVE_PIPELINES_ENABLED != 'true' }}
        run: python -m scanner.workflow_continuation >> "$GITHUB_OUTPUT"
      - name: Queue next live refresh
        if: ${{ steps.live_continuation.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production.yml --ref main -f mode=live
