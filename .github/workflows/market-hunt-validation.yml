name: Market Hunt Forward Validation

on:
  push:
    paths:
      - 'scanner/performance.py'
      - 'scanner/intraday.py'
      - 'scanner/live.py'
      - '.github/workflows/market-hunt-validation.yml'
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-hunt-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore forward journal state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: market-hunt-state-validation-${{ github.run_id }}
          restore-keys: |
            market-hunt-state-

      - name: Build performance and calibration reports
        shell: bash
        run: |
          mkdir -p outputs
          if [ -f .state/paper_journal.csv ]; then
            cp .state/paper_journal.csv outputs/paper_journal.csv
          fi
          python -m scanner.performance

      - name: Publish validation reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "market-hunt-bot"
          git config user.email "market-hunt-bot@users.noreply.github.com"
          rm -rf /tmp/market-hunt-scan-data
          git fetch origin scan-data:scan-data
          git worktree add /tmp/market-hunt-scan-data scan-data
          mkdir -p /tmp/market-hunt-scan-data/dashboard-data
          for f in paper_journal.csv performance_summary.csv performance_by_setup.csv probability_calibration.csv; do
            if [ -f "outputs/$f" ]; then
              cp "outputs/$f" "/tmp/market-hunt-scan-data/dashboard-data/$f"
            fi
          done
          printf "updated_at_utc,workflow_run_id,source_commit\n%s,%s,%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/market-hunt-scan-data/dashboard-data/validation_metadata.csv
          cd /tmp/market-hunt-scan-data
          git add dashboard-data
          if git diff --cached --quiet; then
            echo "Validation dashboard data unchanged."
          else
            git commit -m "Update forward validation data [skip ci]"
            git push origin scan-data
          fi

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-hunt-validation-${{ github.run_id }}
          path: |
            outputs/paper_journal.csv
            outputs/performance_summary.csv
            outputs/performance_by_setup.csv
            outputs/probability_calibration.csv
          if-no-files-found: warn
