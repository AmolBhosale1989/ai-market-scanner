name: Catalyst data plane

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 13-22 * * 1-5"

concurrency:
  group: market-hunt-catalyst-data-plane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      PGSSLMODE: require
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate warehouse schema
        run: python -m scanner.control_plane migrate
      - name: Refresh catalyst evidence
        run: python -m scanner.catalyst_data_plane
