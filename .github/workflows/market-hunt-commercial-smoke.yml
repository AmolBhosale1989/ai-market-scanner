name: Market Hunt Commercial Smoke Test

on:
  push:
    paths:
      - 'commercial/**'
      - 'requirements-commercial.txt'
      - '.github/workflows/market-hunt-commercial-smoke.yml'
  workflow_dispatch:

concurrency:
  group: market-hunt-commercial-smoke
  cancel-in-progress: true

jobs:
  commercial-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install commercial dependencies
        run: pip install -r requirements-commercial.txt

      - name: Validate entitlements and API
        shell: bash
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from commercial.api import app
          from commercial.entitlements import entitlements_for

          assert entitlements_for("FREE")["api_access"] is False
          assert entitlements_for("API")["api_access"] is True

          c=TestClient(app)
          h=c.get("/health")
          assert h.status_code==200
          assert h.json()["research_only"] is True

          r=c.get("/v1/opportunities")
          assert r.status_code==503

          os.environ["MARKET_HUNT_API_TOKEN"]="test-token"
          r=c.get("/v1/opportunities",headers={"Authorization":"Bearer test-token"})
          assert r.status_code==200
          assert r.json()["research_only"] is True
          print("Commercial API smoke test passed.")
          PY
