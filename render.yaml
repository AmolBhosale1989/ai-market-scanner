services:
  - type: web
    name: market-hunt-v3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    # Streamlit health verifies the web process; PostgreSQL publication status
    # is independently enforced by the dashboard and production workflow.
    healthCheckPath: /_stcore/health
    # One gated cutover: deploy manually only after CI and the first complete
    # PostgreSQL publication both pass.
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PUBLICATION_MODE
        value: production
