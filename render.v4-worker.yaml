# V4.1 deployment template only. It is intentionally separate from render.yaml
# so the paid worker cannot be created by the V3 service's automatic Blueprint.
services:
  - type: worker
    name: market-hunt-v4-shadow-worker
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scanner.v4_worker --state-dir /var/data/market-hunt-v4/state --output-dir /var/data/market-hunt-v4/outputs
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: off
    disk:
      name: market-hunt-v4-state
      mountPath: /var/data/market-hunt-v4
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
